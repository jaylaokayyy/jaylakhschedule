<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026NOV18-22 BTS ARIRANG WORLD TOUR KAOHSIUNG之旅</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --card-bg: #ffffff;
            --primary-color: #2b2b2b;
            --purple-accent: #7b2cbf;
            --purple-light: #e0aaff;
            --tag-food: #f8d7da;
            --tag-spot: #d1ecf1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        .header {
            background-color: #fff;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--purple-accent);
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .action-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 6px 14px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .day-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .day-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 0;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .day-btn.active {
            background: var(--purple-accent);
            color: #fff;
            border-color: var(--purple-accent);
        }

        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 卡片樣式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            border-left: 4px solid var(--purple-accent);
        }

        .time {
            font-size: 14px;
            color: #b55d21;
            font-weight: bold;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin: 6px 0;
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0;
        }

        .tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #eee;
        }

        .tag.spot { background: var(--tag-spot); color: #0c5460; }
        .tag.food { background: var(--tag-food); color: #721c24; }
        .tag.purple { background: var(--purple-light); color: #3c096c; font-weight: bold; }

        .transit-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            margin-top: 10px;
            border: 1px solid #eee;
        }

        .nav-link {
            display: inline-block;
            float: right;
            background: #000;
            color: #fff;
            padding: 4px 10px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 12px;
        }

        /* 應援打卡點清單 */
        .checklist-item {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .checklist-item input {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        /* 底部頁籤 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            display: flex;
            border-top: 1px solid #ddd;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--purple-accent);
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="main-title">💜 2026NOV18-22 BTS ARIRANG WORLD TOUR KAOHSIUNG之旅</h1>
        <div class="action-btns">
            <button class="btn" onclick="copySchedule()">複製行程</button>
            <button class="btn" onclick="window.print()">存成 PDF</button>
        </div>
        <div class="day-nav" id="dayNav">
            <div class="day-btn active" onclick="switchDay(1)">Day 1<br><small
