<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026NOV18-22 BTS ARIRANG WORLD TOUR KAOHSIUNG之旅</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --card-bg: #ffffff;
            --primary-color: #2b2b2b;
            --purple-accent: #7b2cbf;
            --purple-light: #e0aaff;
            --tag-food: #f8d7da;
            --tag-spot: #d1ecf1;
            --status-upcoming: #888888;
            --status-active: #28a745;
            --status-ended: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        .header {
            background-color: #fff;
            padding: 12px 15px 8px 15px;
            text-align: center;
            border-bottom: 1px solid #e2e2e2;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .main-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--purple-accent);
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .action-btns {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 5px 12px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .day-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }

        .day-btn {
            flex: 1;
            min-width: 62px;
            padding: 6px 0;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .day-btn.active {
            background: var(--purple-accent);
            color: #fff;
            border-color: var(--purple-accent);
        }

        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            border-left: 4px solid var(--purple-accent);
        }

        .time { font-size: 14px; color: #b55d21; font-weight: bold; }
        .title { font-size: 17px; font-weight: bold; margin: 6px 0; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #eee; }
        .tag.spot { background: var(--tag-spot); color: #0c5460; }
        .tag.food { background: var(--tag-food); color: #721c24; }
        .tag.purple { background: var(--purple-light); color: #3c096c; font-weight: bold; }

        .transit-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            margin-top: 10px;
            border: 1px solid #eee;
            line-height: 1.5;
        }

        .nav-link {
            display: inline-block;
            float: right;
            background: #000;
            color: #fff;
            padding: 4px 10px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 12px;
        }

        /* 大分類標題 */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--purple-accent);
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--purple-light);
            padding-bottom: 6px;
        }
        .section-title:first-child {
            margin-top: 0;
        }

        /* 應援打卡卡片樣式 */
        .checklist-card {
            background: #fff;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            overflow: hidden;
            border-left: 4px solid var(--purple-accent);
        }

        .checklist-header {
            display: flex;
            align-items: center;
            padding: 14px;
            cursor: pointer;
        }

        .checklist-header input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            accent-color: var(--purple-accent);
            cursor: pointer;
        }

        .checklist-title-box {
            flex: 1;
        }

        .checklist-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        .checklist-meta {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }
        .status-badge.upcoming { background-color: var(--status-upcoming); }
        .status-badge.active { background-color: var(--status-active); }
        .status-badge.ended { background-color: var(--status-ended); }

        .arrow-icon {
            font-size: 12px;
            color: #999;
            transition: transform 0.2s ease;
        }
        .checklist-card.open .arrow-icon {
            transform: rotate(180deg);
        }

        .checklist-details {
            display: none;
            padding: 12px 14px 14px 48px;
            background: #fafafa;
            border-top: 1px dashed #eee;
            font-size: 13px;
            color: #444;
            line-height: 1.6;
        }
        .checklist-card.open .checklist-details {
            display: block;
        }

        .detail-row { margin-bottom: 6px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { font-weight: bold; color: var(--purple-accent); }

        /* 底部導覽頁籤 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            display: flex;
            border-top: 1px solid #ddd;
            z-index: 1000;
        }

        .nav-tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-tab-btn.active {
            color: var(--purple-accent);
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

            <button class="day-btn" onclick="switchDay(4)">Day 4<br><small>11/21</small></button>
            <button class="day-btn" onclick="switchDay(5)">Day 5<br><small>11/22</small></button>
        </div>
    </div>
